<aside [class.expanded]="expanded()" class="sidebar">
  <div class="sidebar-header">
    <button
      (click)="toggleSidebar()"
      class="toggle-btn"
      title="Toggle sidebar"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
    <div *ngIf="expanded()" class="logo-section">
      <img src="/images/angular-university-logo.svg" alt="Logo" class="logo" />
    </div>
  </div>

  <div *ngIf="expanded()" class="sidebar-content">
    <button (click)="onNewChat()" class="new-chat-btn">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
      </svg>
      <span>New Chat</span>
    </button>

    <div class="search-section">
      <input type="text" placeholder="Search in Chat" class="search-input" />
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
    </div>

    <div class="chat-history">
      <h3 class="history-title">Recent</h3>
      <div class="history-list">
        <button
          *ngFor="let conversation of conversations()"
          (click)="onSelectConversation(conversation.id)"
          [class.active]="currentConversation()?.id === conversation.id"
          class="history-item"
          title="{{ conversation.title }}"
        >
          <span class="history-text">{{ conversation.title }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="sidebar-footer">
    <button *ngIf="expanded()" (click)="onLogout()" class="logout-btn">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      <span>Logout</span>
    </button>
  </div>
</aside>
