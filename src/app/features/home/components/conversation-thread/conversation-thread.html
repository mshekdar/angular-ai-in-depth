<div class="conversation-thread">
  <div class="messages-container">
    <div *ngFor="let message of conversation()?.messages" 
         [class.user-message]="message.sender === 'user'"
         [class.ai-message]="message.sender === 'ai'"
         class="message-wrapper">
      <div class="message-content">
        <div class="message-bubble">
          <p class="message-text">{{ message.content }}</p>
          <div class="message-footer">
            <span class="message-time">{{ formatTime(message.timestamp) }}</span>
            <button 
              *ngIf="message.sender === 'ai'"
              (click)="copyToClipboard(message.content)"
              class="copy-btn"
              title="Copy message"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="thinking-section">
    <div class="spinner"></div>
    <p class="thinking-text">It can take up to 20 seconds to get a reply.</p>
    <p class="thinking-timer">10 seconds ...</p>
  </div>

  <div class="input-section">
    <div class="input-wrapper">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      <input
        type="text"
        placeholder="Send a message"
        class="chat-input"
      />
      <button class="send-btn" title="Send message">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="12" y1="5" x2="12" y2="19" />
          <polyline points="19 12 12 5 5 12" />
        </svg>
      </button>
    </div>
  </div>

  <p class="disclaimer">
    ⚠️ Give our AI as much context as possible, to get the best results. If an error occurs, please try again after a few seconds.
  </p>
</div>
